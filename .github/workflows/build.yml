name: Build Release APK for Cafe Bazaar

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Env
        run: |
          touch .env
          keytool -genkey -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass khanbaba123 -keypass khanbaba123 -dname "CN=KhanBabaee,O=KhanBabaee,C=IR"

      - name: Build Release APK with Gradle
        env:
          STORE_PASSWORD: khanbaba123
          KEY_PASSWORD: khanbaba123
        run: gradle assembleRelease

      - name: Upload Release APK for Cafe Bazaar
        uses: actions/upload-artifact@v4
        with:
          name: KhanBabaee-Bazaar-Release-APK
          path: app/build/outputs/apk/release/*.apk
